<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francés Limón v2</title>
    <style>
        :root {
            --bg-color: #0b0f0b;
            --lime-bright: #a2e03b;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-ambient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 650px;
            padding: 30px;
            width: 100%;
        }

        /* Caja de audio limpia y sin marcos de video rotos */
        .audio-box {
            margin-bottom: 60px;
        }

        audio {
            width: 100%;
            max-width: 320px;
            outline: none;
            filter: invert(90%) hue-rotate(75deg);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border-radius: 30px;
        }

        .lyrics-container {
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .phrase {
            position: absolute;
            font-size: 2.1rem;
            font-style: italic;
            line-height: 1.5;
            color: var(--text-main);
            opacity: 0;
            transform: translateY(15px);
            transition: all 1s ease-in-out;
            width: 100%;
        }

        .phrase.active {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 25px rgba(162, 224, 59, 0.25);
        }

        .phrase.exit {
            opacity: 0;
            transform: translateY(-15px);
            filter: blur(4px);
        }

        .highlight {
            color: var(--lime-bright);
            font-weight: bold;
            text-shadow: 0 0 12px rgba(162, 224, 59, 0.5);
        }

        .footer-note {
            position: fixed;
            bottom: 25px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 10;
            font-family: sans-serif;
            opacity: 0.6;
        }

        @media (max-width: 600px) {
            .phrase { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-ambient"></canvas>

    <div class="container">
        <!-- Reproductor de Audio Nativo Puro -->
        <div class="audio-box">
            <audio controls>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
                Tu navegador no soporta audio.
            </audio>
        </div>

        <!-- Letra Cronológica Oficial de Francés Limón -->
        <div class="lyrics-container">
            <p class="phrase active">Dale play al audio de arriba...</p>
            <p class="phrase">No me digas que <span class="highlight">es muy tarde</span>...</p>
            <p class="phrase">No me digas que <span class="highlight">el tiempo pasó</span>.</p>
            <p class="phrase">Guardamos un <span class="highlight">código secreto</span> entre tú y yo...</p>
            <p class="phrase">Un pacto silencioso de <span class="highlight">amores lejanos</span>.</p>
            <p class="phrase">Un hilo invisible sabor a <span class="highlight">Francés Limón</span>...</p>
        </div>
    </div>

    <div class="footer-note">Código Secreto • Enanitos Verdes</div>

    <script>
        const phrases = document.querySelectorAll('.phrase');
        let currentIndex = 0;

        function nextPhrase() {
            let current = phrases[currentIndex];
            current.classList.remove('active');
            current.classList.add('exit');

            setTimeout(() => {
                current.classList.remove('exit');
            }, 1000);

            currentIndex = (currentIndex + 1) % phrases.length;
            
            setTimeout(() => {
                phrases[currentIndex].classList.add('active');
            }, 150);
        }

        // Cambia de frase de forma suave cada 5 segundos
        setInterval(nextPhrase, 5000);

        // Fondo de partículas flotantes
        const canvas = document.getElementById('canvas-ambient');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        for (let i = 0; i < 35; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 2.5 + 1,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                alpha: Math.random() * 0.4 + 0.1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(162, 224, 59, ${p.alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#a2e03b';
                ctx.fill();
            });
            ctx.shadowBlur = 0;
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
