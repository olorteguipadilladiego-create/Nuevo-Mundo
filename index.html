<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francés Limón - Código Secreto</title>
    <style>
        :root {
            --bg-color: #0e120e;
            --lime-bright: #96cd39;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fondo de partículas flotantes */
        #canvas-ambient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.4;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            padding: 20px;
            width: 100%;
        }

        /* Reproductor de Audio Estilizado */
        .audio-box {
            margin-bottom: 50px;
        }

        audio {
            width: 100%;
            max-width: 340px;
            outline: none;
            filter: invert(90%) hue-rotate(65deg); /* Tinte verde limón oscuro */
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 30px;
        }

        /* Letras Animadas */
        .lyrics-container {
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .phrase {
            position: absolute;
            font-size: 2.1rem;
            font-style: italic;
            line-height: 1.4;
            color: var(--text-main);
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }

        .phrase.active {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 20px rgba(150, 205, 57, 0.3);
        }

        .phrase.exit {
            opacity: 0;
            transform: translateY(-20px);
            filter: blur(4px);
        }

        .highlight {
            color: var(--lime-bright);
            font-weight: bold;
            text-shadow: 0 0 15px rgba(150, 205, 57, 0.6);
        }

        .footer-note {
            position: fixed;
            bottom: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 10;
            font-family: sans-serif;
            opacity: 0.5;
        }

        @media (max-width: 600px) {
            .phrase { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-ambient"></canvas>

    <div class="container">
        <!-- Reproductor con el archivo de audio REAL de la canción original -->
        <div class="audio-box">
            <audio controls>
                <source src="https://archive.org/download/los-enanitos-verdes-frances-limon/Los%20Enanitos%20Verdes%20-%20Franc%C3%A9s%20Lim%C3%B3n.mp3" type="audio/mpeg">
                Tu navegador no soporta este elemento de audio.
            </audio>
        </div>

        <!-- Letra oficial cronológica -->
        <div class="lyrics-container">
            <p class="phrase active">Dale play a Francés Limón...</p>
            <p class="phrase">No me digas que <span class="highlight">es muy tarde</span>...</p>
            <p class="phrase">No me digas que <span class="highlight">el tiempo pasó</span>.</p>
            <p class="phrase">Guardamos un <span class="highlight">código secreto</span> entre tú y yo...</p>
            <p class="phrase">Un pacto silencioso de <span class="highlight">amores lejanos</span>.</p>
            <p class="phrase">Un hilo invisible sabor a <span class="highlight">Francés Limón</span>...</p>
        </div>
    </div>

    <div class="footer-note">Código Secreto • Enanitos Verdes</div>

    <script>
        // Animación de las frases
        const phrases = document.querySelectorAll('.phrase');
        let currentIndex = 0;

        function nextPhrase() {
            let current = phrases[currentIndex];
            current.classList.remove('active');
            current.classList.add('exit');

            setTimeout(() => {
                current.classList.remove('exit');
            }, 1200);

            currentIndex = (currentIndex + 1) % phrases.length;
            
            setTimeout(() => {
                phrases[currentIndex].classList.add('active');
            }, 100);
        }

        // Cambia la frase cada 4.8 segundos
        setInterval(nextPhrase, 4800);

        // Fondo de partículas
        const canvas = document.getElementById('canvas-ambient');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 3 + 1,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                alpha: Math.random() * 0.4 + 0.1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(150, 205, 57, ${p.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#96cd39';
                ctx.fill();
            });

            ctx.shadowBlur = 0;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
